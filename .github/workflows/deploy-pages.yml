name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and run tests
        run: |
          npm run typecheck
          npm run test:themes
          npm run test:chat

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static portfolio
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish portfolio
        id: deployment
        uses: actions/deploy-pages@v4
